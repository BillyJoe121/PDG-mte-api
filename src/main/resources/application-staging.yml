spring:
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
  datasource:
    url: ${SUPABASE_DB_URL:${DB_URL}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:0}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:30000}
  data:
    jpa:
      repositories:
        bootstrap-mode: ${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:lazy}
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: false
        query:
          plan_cache_max_size: ${HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE:128}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

mte:
  auth:
    mode: ${MTE_AUTH_MODE:mock}
  seed:
    enabled: ${MTE_SEED_ENABLED:false}
  integration:
    trayectoria:
      mode: ${MTE_TRAYECTORIA_PROJECTS_MODE:mock}

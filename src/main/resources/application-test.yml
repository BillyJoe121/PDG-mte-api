spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:mte-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

mte:
  seed:
    enabled: true

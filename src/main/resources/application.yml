server:
  port: ${PORT:8081}

spring:
  application:
    name: pdg-mte-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:h2:mem:mte;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure: INFO

mte:
  cors:
    allowed-origins: ${MTE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  auth:
    # Key that signs access tokens (at least 32 bytes). Without it a temporary key is used
    # and sessions end when the API restarts.
    jwt-secret: ${MTE_AUTH_JWT_SECRET:}
    issuer: ${MTE_AUTH_ISSUER:mte-api}
    access-token-ttl: ${MTE_AUTH_ACCESS_TOKEN_TTL:1h}
    access-link-ttl: ${MTE_AUTH_ACCESS_LINK_TTL:72h}
    # Frontend page where a person sets their password from an access link.
    access-link-url: ${MTE_ACCESS_LINK_URL:}
    require-jwt-secret: ${MTE_AUTH_REQUIRE_JWT_SECRET:false}
    # First sign-in on an empty database: logs a single-use link per administrator while
    # no administrator has a password. Keep it off once an administrator has signed in.
    bootstrap-admin-link: ${MTE_AUTH_BOOTSTRAP_ADMIN_LINK:false}
  seed:
    enabled: ${MTE_SEED_ENABLED:true}
  integration:
    trayectoria:
      mode: ${MTE_TRAYECTORIA_PROJECTS_MODE:mock}
      external-base-url: ${TRAYECTORIA_BASE_URL:http://localhost:8080/api/v1}
      projects-path: ${TRAYECTORIA_PROJECTS_PATH:/proyectos}
      source-name: ${TRAYECTORIA_SOURCE_NAME:TRAYECTORIA_DOCENTE}

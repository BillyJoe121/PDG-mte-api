spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

mte:
  auth:
    require-jwt-secret: true
  seed:
    enabled: ${MTE_SEED_ENABLED:false}

# API docs and the interactive console stay off unless explicitly enabled.
springdoc:
  api-docs:
    enabled: ${MTE_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MTE_API_DOCS_ENABLED:false}

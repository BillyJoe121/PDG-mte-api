services:
  - type: web
    runtime: docker
    name: pdg-mte-api-staging
    region: oregon
    plan: free
    branch: develop
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: JAVA_OPTS
        value: -Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      - key: SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE
        value: lazy
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"
      - key: DB_MAX_POOL_SIZE
        value: "3"
      - key: DB_MIN_IDLE
        value: "0"
      - key: HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE
        value: "128"
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USERNAME
        value: postgres.otqqavjfriyqxntpwcgm
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JPA_DDL_AUTO
        value: none
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - key: MTE_SEED_ENABLED
        value: "false"
      - key: MTE_AUTH_MODE
        value: mock
      - key: MTE_TRAYECTORIA_PROJECTS_MODE
        value: mock
      - key: MTE_CORS_ALLOWED_ORIGINS
        sync: false

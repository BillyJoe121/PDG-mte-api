# Checks only. Deployment runs from the Bitbucket repository through Jenkins (Jenkinsfile).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests run against in-memory H2; no database or secrets are needed.
      # `verify` also enforces the JaCoCo coverage rule.
      # mvnw is stored without the executable bit, so it is run through sh.
      - name: Test and coverage
        run: sh ./mvnw -B verify
